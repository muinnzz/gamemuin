<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Elemental Chronicles</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
body{font-family:'Rajdhani',sans-serif;background:radial-gradient(ellipse at top,#1a1a3e,#0a0a1a 70%);color:#eee;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:10px;overflow-x:hidden}
.game{width:100%;max-width:1000px;background:linear-gradient(180deg,#1a1a2e,#0f0f1e);border:2px solid #4a4a8a;border-radius:12px;padding:15px;box-shadow:0 0 40px rgba(100,100,255,.3);position:relative}
h1{text-align:center;font-family:'Cinzel',serif;font-size:20px;background:linear-gradient(90deg,#ff6b6b,#4ecdc4,#ffd93d,#a29bfe);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:10px;letter-spacing:2px}
.topbar{display:flex;justify-content:space-between;align-items:center;background:#0a0a1a;padding:8px 12px;border-radius:8px;margin-bottom:10px;border:1px solid #2a2a5a;font-size:13px;flex-wrap:wrap;gap:8px}
.topbar .stat{color:#ffd93d}
.topbar .stat span{color:#fff;font-weight:bold}
.btn-group{display:flex;gap:4px;flex-wrap:wrap}
.btn-text{background:#2a2a5a;color:#fff;border:1px solid #4a4a8a;border-radius:5px;padding:6px 12px;cursor:pointer;font-size:11px;font-family:inherit;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.btn-text:hover{background:#4a4a8a}
.btn-text.primary{background:linear-gradient(135deg,#ffd93d,#ff6b35);color:#000}
.btn-text.danger{background:linear-gradient(135deg,#ff4444,#8b0000);color:#fff}
.btn-text.success{background:linear-gradient(135deg,#6bcf7f,#4ecdc4);color:#000}
.btn-text.info{background:linear-gradient(135deg,#a29bfe,#4ecdc4);color:#000}
.btn-mini{background:#2a2a5a;color:#fff;border:1px solid #4a4a8a;border-radius:5px;padding:5px 9px;cursor:pointer;font-size:11px;font-family:inherit;font-weight:600}
.btn-mini:hover{background:#4a4a8a}
.btn-mini:disabled{opacity:.4;cursor:not-allowed}
.sidebar-toggle{position:fixed;top:80px;left:10px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#4a4a8a,#2a2a5a);border:2px solid #ffd93d;color:#fff;font-size:22px;cursor:pointer;z-index:99999;display:flex;align-items:center;justify-content:center;font-weight:bold}
.sidebar-toggle:hover{background:linear-gradient(135deg,#ffd93d,#ff6b35);color:#000}
.sidebar-toggle.open{left:270px}
.sidebar{position:fixed;top:0;left:-290px;width:270px;height:100vh;background:linear-gradient(180deg,#0f0f2a,#1a1a3e);border-right:2px solid #4a4a8a;z-index:99998;transition:left .3s;overflow-y:auto;padding:15px 10px;box-shadow:5px 0 25px rgba(0,0,0,.7)}
.sidebar.open{left:0}
.sb-header{text-align:center;padding:10px 0 15px;border-bottom:2px solid #2a2a5a;margin-bottom:15px}
.sb-header h3{font-family:'Cinzel',serif;font-size:18px;color:#ffd93d;letter-spacing:2px}
.sb-section{margin-bottom:18px}
.sb-section-title{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1.5px;padding:5px 10px;margin-bottom:5px;border-left:3px solid #4a4a8a}
.sb-btn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;background:#1a1a3e;border:1px solid #2a2a5a;border-radius:6px;color:#fff;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;text-align:left;margin-bottom:5px}
.sb-btn:hover{background:#2a2a5a;border-color:#ffd93d;transform:translateX(4px)}
.sb-emoji{font-size:20px;width:26px;text-align:center}
.sb-label{flex:1}
.battle{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;min-height:200px}
.side{background:linear-gradient(180deg,#0f0f2a,#1a1a3e);border:1px solid #2a2a5a;border-radius:10px;padding:12px;position:relative;overflow:hidden}
.side.enemy-side{background:linear-gradient(180deg,#2a0f1a,#3e1a2a);border-color:#5a2a3a}
.fighter{text-align:center;position:relative}
.fighter .sprite{font-size:65px;margin:8px 0;display:inline-block;filter:drop-shadow(0 0 15px currentColor)}
.fighter .sprite.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fighter .name{font-size:15px;font-weight:bold;margin-bottom:4px}
.fighter .hp-text{font-size:12px;color:#bbb;margin-bottom:4px}
.bar{height:10px;background:#000;border-radius:5px;overflow:hidden;margin:3px 0;border:1px solid #333}
.bar-fill{height:100%;transition:width .4s ease}
.hp-fill{background:linear-gradient(90deg,#ff4444,#ff8888)}
.energy-fill{background:linear-gradient(90deg,#ffd93d,#fff08a)}
.aura{position:absolute;top:8px;right:8px;display:flex;gap:3px;flex-wrap:wrap;max-width:80px}
.aura-icon{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;box-shadow:0 0 10px currentColor;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.battle-log{background:#000;border:1px solid #2a2a5a;border-radius:8px;padding:8px 12px;height:110px;overflow-y:auto;font-size:12px;line-height:1.5;margin-bottom:10px}
.battle-log p{margin-bottom:2px}
.log-dmg{color:#ff6b6b}.log-heal{color:#6bcf7f}.log-reaction{color:#ffd93d;font-weight:bold}
.log-info{color:#74e0ff}.log-crit{color:#ff6b35;font-weight:bold}.log-boss{color:#ff4444;font-weight:bold}
.log-loot{color:#ffd93d;font-weight:bold}
.char-bar{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:4px}
.char-slot{flex:0 0 auto;width:95px;background:#1a1a3e;border:2px solid #2a2a5a;border-radius:8px;padding:6px;text-align:center;cursor:pointer;position:relative}
.char-slot.active{border-color:#ffd93d;box-shadow:0 0 12px rgba(255,217,61,.5)}
.char-slot.dead{opacity:.4;filter:grayscale(1)}
.char-slot .cs-sprite{font-size:24px}
.char-slot .cs-name{font-size:10px;margin-top:2px;font-weight:bold}
.char-slot .cs-el{font-size:9px;opacity:.8}
.char-slot .cs-key{position:absolute;top:2px;left:4px;font-size:9px;background:#000;padding:1px 4px;border-radius:3px;color:#ffd93d}
.char-slot .cs-con{position:absolute;top:2px;right:4px;font-size:9px;background:#ffd93d;color:#000;padding:1px 4px;border-radius:3px;font-weight:bold}
.skills{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.skill-btn{background:linear-gradient(180deg,#2a2a5a,#1a1a3e);border:2px solid #4a4a8a;border-radius:8px;padding:8px 4px;color:#fff;cursor:pointer;font-family:inherit;text-align:center;position:relative;overflow:hidden}
.skill-btn:disabled{opacity:.4;cursor:not-allowed}
.skill-btn .sk-icon{font-size:20px}
.skill-btn .sk-name{font-size:10px;font-weight:bold;margin-top:2px}
.skill-btn .sk-info{font-size:9px;opacity:.8;margin-top:1px}
.skill-btn .cd-overlay{position:absolute;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;color:#ffd93d}
.enemy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;margin-bottom:10px;max-height:110px;overflow-y:auto}
.enemy-mini{background:#3e1a2a;border:1px solid #5a2a3a;border-radius:6px;padding:4px;text-align:center;cursor:pointer;font-size:10px}
.enemy-mini.target{border-color:#ff6b6b;box-shadow:0 0 8px #ff6b6b}
.enemy-mini .em-sprite{font-size:22px}
.enemy-mini.dead{opacity:.3;filter:grayscale(1);pointer-events:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.show{display:flex}
.modal-content{background:linear-gradient(180deg,#1a1a3e,#0f0f2a);border:2px solid #4a4a8a;border-radius:12px;padding:20px;max-width:650px;width:100%;max-height:85vh;overflow-y:auto}
.modal h2{text-align:center;margin-bottom:15px;background:linear-gradient(90deg,#ffd93d,#ff6b6b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.modal .close-btn{display:block;margin:15px auto 0;padding:10px 30px;background:#4a4a8a;border:none;border-radius:6px;color:#fff;cursor:pointer;font-size:14px;font-family:inherit;font-weight:bold}
.tabs{display:flex;gap:5px;margin-bottom:15px;flex-wrap:wrap}
.tab{padding:6px 14px;background:#2a2a5a;border:1px solid #4a4a8a;border-radius:20px;cursor:pointer;font-size:12px;font-weight:600}
.tab.active{background:#ff6b35}
.card{background:#1a1a3e;border:1px solid #2a2a5a;border-radius:8px;padding:10px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.card.clickable{cursor:pointer}
.card.rarity-2{border-left:4px solid #888}
.card.rarity-3{border-left:4px solid #4ecdc4}
.card.rarity-4{border-left:4px solid #a29bfe}
.card.rarity-5{border-left:4px solid #ffd93d;background:linear-gradient(90deg,#1a1a3e,#2a1a0a)}
.card .c-icon{font-size:32px}
.card .c-info{flex:1}
.card .c-name{font-size:14px;font-weight:bold}
.card .c-desc{font-size:11px;color:#aaa}
.card .c-stat{font-size:12px;color:#4ecdc4;font-weight:bold}
.card .c-equipped{color:#ffd93d;font-size:11px;font-weight:bold}
.result-banner{text-align:center;font-size:20px;font-weight:bold;padding:10px;margin:8px 0;border-radius:8px;display:none}
.result-banner.show{display:block}
.result-win{background:linear-gradient(90deg,#6bcf7f,#4ecdc4);color:#000}
.result-lose{background:linear-gradient(90deg,#ff4444,#8b0000);color:#fff}
.float-dmg{position:absolute;font-size:22px;font-weight:bold;pointer-events:none;animation:floatUp 1s ease-out forwards;text-shadow:2px 2px 0 #000;z-index:10}
@keyframes floatUp{0%{transform:translateY(0) scale(.5);opacity:0}20%{transform:translateY(-10px) scale(1.3);opacity:1}100%{transform:translateY(-60px) scale(1);opacity:0}}
.reaction-text{position:absolute;top:40%;left:50%;transform:translateX(-50%);font-size:18px;font-weight:bold;text-shadow:0 0 10px currentColor;pointer-events:none;animation:reactionPop .9s ease-out forwards;z-index:20}
@keyframes reactionPop{0%{transform:translateX(-50%) scale(0);opacity:0}40%{transform:translateX(-50%) scale(1.4);opacity:1}100%{transform:translateX(-50%) scale(1) translateY(-30px);opacity:0}}
.toast{position:fixed;top:20px;right:20px;background:linear-gradient(90deg,#ffd93d,#ff6b35);color:#000;padding:12px 20px;border-radius:8px;font-weight:bold;font-size:13px;z-index:200;animation:slideIn .4s,slideOut .4s 2.6s;max-width:280px}
@keyframes slideIn{from{transform:translateX(400px)}to{transform:translateX(0)}}
@keyframes slideOut{from{transform:translateX(0);opacity:1}to{transform:translateX(400px);opacity:0}}
.phase-badge{display:inline-block;background:#8b0000;color:#fff;padding:2px 8px;border-radius:10px;font-size:10px;margin-left:5px}
.map-tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:4px}
.map-tab{flex:0 0 auto;padding:6px 12px;background:#1a1a3e;border:2px solid #2a2a5a;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600}
.map-tab.active{border-color:#ffd93d;background:#2a2a5a}
.map-tab.locked{opacity:.4;cursor:not-allowed}
.abyss-panel{background:linear-gradient(180deg,#1a0a2e,#2a0f3e);border:2px solid #a29bfe;border-radius:10px;padding:15px;margin-bottom:10px;display:none}
.abyss-panel.show{display:block}
.abyss-panel h3{text-align:center;margin-bottom:10px;color:#a29bfe}
.abyss-timer{text-align:center;font-size:32px;font-weight:bold;color:#ff6b35;margin:10px 0}
.event-banner{background:linear-gradient(90deg,#ffd93d,#ff6b35,#a29bfe);padding:10px;border-radius:8px;margin-bottom:10px;text-align:center;font-weight:bold;color:#000;font-size:13px;display:none}
.event-banner.show{display:block}
.gacha-card{border-radius:10px;padding:12px;text-align:center;margin:8px 0}
@media(max-width:700px){.battle{grid-template-columns:1fr}.skills{grid-template-columns:repeat(3,1fr)}.fighter .sprite{font-size:50px}h1{font-size:15px}}
</style>
</head>
<body>
<div class="game">
<h1>ELEMENTAL CHRONICLES</h1>
<div class="topbar">
<div class="stat">Mora: <span id="mora">500</span></div>
<div class="stat">Primo: <span id="primo">1600</span></div>
<div class="stat">Wave: <span id="wave">1</span></div>
<div class="stat">AR: <span id="ar">1</span></div>
<div class="stat">Resin: <span id="resinDisp">160</span></div>
<div class="btn-group" id="topbarBtns"></div>
</div>
<div class="event-banner" id="eventBanner"></div>
<div class="map-tabs" id="mapTabs"></div>
<div class="abyss-panel" id="abyssPanel">
<h3>SPIRAL ABYSS</h3>
<div class="abyss-timer" id="abyssTimer">03:00</div>
<div style="text-align:center;font-size:12px;color:#bbb;margin-bottom:10px;">Kalahkan semua musuh sebelum waktu habis!</div>
<div style="text-align:center;"><button class="btn-mini" onclick="startAbyss()" id="abyssStartBtn">Mulai Abyss</button></div>
</div>
<div class="result-banner" id="resultBanner"></div>
<div class="battle">
<div class="side" id="playerSide">
<div class="fighter" id="playerFighter">
<div class="sprite" id="playerSprite">⚔️</div>
<div class="name" id="playerName">Player</div>
<div class="hp-text" id="playerHPText">HP: 100 / 100</div>
<div class="bar"><div class="bar-fill hp-fill" id="playerHPBar" style="width:100%"></div></div>
<div class="hp-text" id="playerEnergyText">Energy: 0 / 80</div>
<div class="bar"><div class="bar-fill energy-fill" id="playerEnergyBar" style="width:0%"></div></div>
<div class="aura" id="playerAura"></div>
</div>
</div>
<div class="side enemy-side" id="enemySide">
<div class="fighter" id="enemyFighter">
<div class="sprite" id="enemySprite">👹</div>
<div class="name" id="enemyName">Enemy</div>
<div class="hp-text" id="enemyHPText">HP: 100 / 100</div>
<div class="bar"><div class="bar-fill hp-fill" id="enemyHPBar" style="width:100%"></div></div>
<div class="aura" id="enemyAura"></div>
</div>
</div>
</div>
<div class="battle-log" id="battleLog"></div>
<div class="enemy-grid" id="enemyGrid"></div>
<div class="char-bar" id="charBar"></div>
<div class="skills" id="skillBar"></div>
</div>

<div class="modal" id="charModal"><div class="modal-content"><h2>Karakter</h2><div class="tabs" id="charTabs"></div><div id="charContent"></div><button class="close-btn" onclick="closeModal('charModal')">Tutup</button></div></div>
<div class="modal" id="invModal"><div class="modal-content"><h2>Inventory</h2><div id="invContent"></div><button class="close-btn" onclick="closeModal('invModal')">Tutup</button></div></div>
<div class="modal" id="gachaModal"><div class="modal-content"><h2>Gacha</h2><div id="gachaResult"></div><button class="close-btn" onclick="closeModal('gachaModal')">Tutup</button></div></div>
<div class="modal" id="talentModal"><div class="modal-content"><h2>Talent</h2><div id="talentContent"></div><button class="close-btn" onclick="closeModal('talentModal')">Tutup</button></div></div>
<div class="modal" id="questModal"><div class="modal-content"><h2>Quest</h2><div id="questContent"></div><button class="close-btn" onclick="closeModal('questModal')">Tutup</button></div></div>
<div class="modal" id="achModal"><div class="modal-content"><h2>Achievement</h2><div id="achContent"></div><button class="close-btn" onclick="closeModal('achModal')">Tutup</button></div></div>
<div class="modal" id="coopModal"><div class="modal-content"><h2>Co-op</h2><div id="coopContent"></div><button class="close-btn" onclick="closeModal('coopModal')">Tutup</button></div></div>
<div class="modal" id="bpModal"><div class="modal-content"><h2>Battle Pass</h2><div id="bpContent"></div><button class="close-btn" onclick="closeModal('bpModal')">Tutup</button></div></div>
<div class="modal" id="pvpModal"><div class="modal-content"><h2>PvP</h2><div id="pvpContent"></div><button class="close-btn" onclick="closeModal('pvpModal')">Tutup</button></div></div>
<div class="modal" id="craftModal"><div class="modal-content"><h2>Crafting</h2><div id="craftContent"></div><button class="close-btn" onclick="closeModal('craftModal')">Tutup</button></div></div>
<div class="modal" id="storyModal"><div class="modal-content"><h2>Story</h2><div id="storyContent"></div><button class="close-btn" onclick="closeModal('storyModal')">Tutup</button></div></div>

<script src="rpg.js"></script>
</body>
</html>
